# ============================================================================
# CAMBIO (24-11-2026): dirección base de la API configurable.
# Motivo: la URL estaba fija como http://10.0.2.2:5000/ dentro de RetrofitCliente.kt.
# Ese alias (10.0.2.2) SOLO existe en el emulador de Android Studio; en un celular
# físico la conexión falla con "failed to connect to /10.0.2.2 (port 5000)".
# Al ponerla aquí se cambia sin editar código Kotlin ni la API.
#
# Opciones según dónde corras la app:
#   Celular por USB  -> http://127.0.0.1:5000/  (requiere: adb reverse tcp:5000 tcp:5000)
#   Emulador AS      -> http://10.0.2.2:5000/
#   Genymotion       -> http://10.0.3.2:5000/
#   Celular por Wi-Fi-> http://192.168.35.138:5000/  (IP LAN del PC; la API debe
#                       escuchar en 0.0.0.0 y el Firewall debe permitir el puerto)
# ============================================================================
api.url=http://127.0.0.1:5000/